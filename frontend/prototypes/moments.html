<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serein · 图文流原型</title>
<style>
  :root { color-scheme: light; --paper:#fbfaf7; --ink:#292925; --muted:#85827b; --line:#e6e2da; --accent:#61776e; --gap:5px; }
  * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#eeece7; font:16px/1.7 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { width:min(100%, 680px); min-height:100vh; margin:auto; padding:52px 28px 80px; background:var(--paper); }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:42px; } h1 { margin:0; font:500 24px/1.2 ui-serif,Georgia,"Songti SC",serif; letter-spacing:.02em; } header span { color:var(--muted); font-size:13px; }
  .month { display:flex; align-items:center; gap:12px; margin:34px 0 16px; color:var(--muted); font-size:13px; } .month::after { content:""; height:1px; flex:1; background:var(--line); }
  article { padding:20px 0 28px; border-bottom:1px solid var(--line); } time { display:block; margin-bottom:12px; color:var(--accent); font-size:13px; font-variant-numeric:tabular-nums; } h2 { margin:0 0 8px; font:500 19px/1.45 ui-serif,Georgia,"Songti SC",serif; } p { margin:0; white-space:pre-line; } .photos { display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--gap); width:min(100%, 420px); margin-top:15px; } .photos[data-count="1"] { grid-template-columns:minmax(0, 1fr); width:min(100%, 420px); } .photos[data-count="2"], .photos[data-count="3"], .photos[data-count="4"] { grid-template-columns:repeat(2, 1fr); width:min(100%, 330px); }
  .photo { position:relative; aspect-ratio:1; overflow:hidden; border:0; padding:0; background:#d5d1c9; cursor:zoom-in; } .photos[data-count="1"] .photo { aspect-ratio:4/3; } .photo img { width:100%; height:100%; display:block; object-fit:cover; transition:transform .25s ease; } .photo:hover img { transform:scale(1.035); } .more::after { content:attr(data-more); position:absolute; inset:0; display:grid; place-items:center; color:#fff; background:rgb(0 0 0 / .5); font-size:26px; font-weight:400; }
  .actions { margin-top:11px; color:var(--muted); font-size:12px; } dialog { width:min(100vw, 900px); max-width:none; height:100dvh; max-height:none; margin:0 auto; border:0; padding:0; color:white; background:rgb(0 0 0 / .94); } dialog::backdrop { background:rgb(0 0 0 / .64); backdrop-filter:blur(3px); } .viewer { display:grid; grid-template-rows:auto 1fr auto; height:100%; } .viewer-top,.viewer-bottom { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; font-size:13px; color:#d4d4d2; } .viewer button { border:0; padding:8px; color:inherit; background:transparent; cursor:pointer; font:inherit; } .viewer-stage { display:grid; grid-template-columns:54px minmax(0,1fr) 54px; align-items:center; } .viewer-stage img { max-width:100%; max-height:calc(100dvh - 128px); justify-self:center; object-fit:contain; } .viewer-nav { font-size:28px !important; } .viewer-nav:disabled { opacity:.25; cursor:default; }
  @media (max-width:520px) { main { padding:34px 18px 60px; } .photos { width:100%; } .photos[data-count="2"], .photos[data-count="3"], .photos[data-count="4"] { width:min(100%,330px); } }
</style>
<main>
  <header><h1>Serein</h1><span>图文流原型</span></header>
  <section id="feed" aria-label="图文日记"></section>
</main>
<dialog id="viewer" aria-label="图片查看器"><div class="viewer"><div class="viewer-top"><span id="position"></span><button id="close" aria-label="关闭">关闭 ×</button></div><div class="viewer-stage"><button class="viewer-nav" id="previous" aria-label="上一张">‹</button><img id="large" alt=""><button class="viewer-nav" id="next" aria-label="下一张">›</button></div><div class="viewer-bottom"><span id="caption"></span><span>← → 切换 · Esc 关闭</span></div></div></dialog>
<script>
  const colors=[['#879f95','#d2b59e'],['#7c95a8','#e1d3ae'],['#b08f85','#ded6c1'],['#8da08a','#e0bc9e'],['#8682a1','#d7c8ba'],['#b1a174','#d9d9c4'],['#9b7c6d','#cbb798'],['#698d91','#d3d3c2'],['#a48c99','#d8c7be'],['#8d9b70','#d4c095'],['#8c7c71','#d4cfc3'],['#748a9b','#ddc5aa']];
  const image=(i)=>{const [a,b]=colors[i%colors.length]; const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="800" height="800" fill="url(#g)"/><circle cx="${170+i*17%500}" cy="${160+i*23%460}" r="${100+i*11%140}" fill="white" fill-opacity=".16"/><path d="M0 ${500-i*9%180} Q220 ${330+i*14%230} 430 ${510-i*21%200} T800 ${430+i*13%250} V800H0Z" fill="#27322d" fill-opacity=".21"/></svg>`; return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`};
  const entries=[{date:'2026年08月12日 18:40',title:'傍晚的散步',text:'下班后沿着河边走了一会儿。风把热气吹散，水面开始有一点点亮。',images:12},{date:'2026年08月11日 09:20',text:'今天的第一杯咖啡。',images:1},{date:'2026年07月30日 22:15',title:'雨后的房间',text:'窗户开着，空气是湿的。把白天没有做完的事情先放一放。',images:4}];
  const feed=document.querySelector('#feed'); let active=[]; let index=0; const dialog=document.querySelector('#viewer'); const large=document.querySelector('#large');
  function month(date){return date.slice(0,8)} function render(){let last=''; for(const entry of entries){const m=month(entry.date); if(m!==last){const h=document.createElement('div');h.className='month';h.textContent=m;feed.append(h);last=m} const article=document.createElement('article');article.innerHTML=`<time>${entry.date}</time>${entry.title?`<h2>${entry.title}</h2>`:''}<p>${entry.text}</p><div class="actions">编辑　·　历史版本　·　删除</div>`;if(entry.images){const grid=document.createElement('div');grid.className='photos';grid.dataset.count=Math.min(entry.images,9);for(let i=0;i<Math.min(entry.images,9);i++){const b=document.createElement('button');b.className='photo'+(i===8&&entry.images>9?' more':'');b.dataset.more=i===8?`+${entry.images-9}`:'';b.innerHTML=`<img src="${image(i)}" alt="第 ${i+1} 张图片">`;b.onclick=()=>open(entry.images,i);grid.append(b)}article.insertBefore(grid,article.querySelector('.actions'))}feed.append(article)}}
  function open(count,start){active=Array.from({length:count},(_,i)=>image(i));index=start;show();dialog.showModal()} function show(){large.src=active[index];large.alt=`第 ${index+1} 张图片`;document.querySelector('#position').textContent=`${index+1} / ${active.length}`;document.querySelector('#caption').textContent=`图片 ${index+1}`;previous.disabled=index===0;next.disabled=index===active.length-1} const previous=document.querySelector('#previous'),next=document.querySelector('#next');previous.onclick=()=>{if(index){index--;show()}};next.onclick=()=>{if(index<active.length-1){index++;show()}};document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowLeft')previous.click();if(e.key==='ArrowRight')next.click()});render();
</script>
