<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serein · 图文流原型</title>
<style>:root{--paper:#fbfaf7;--ink:#292925;--muted:#85827b;--line:#e6e2da;--accent:#61776e;--gap:5px}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#eeece7;font:16px/1.7 system-ui,"PingFang SC",sans-serif}main{width:min(100%,680px);min-height:100vh;margin:auto;padding:52px 28px 80px;background:var(--paper)}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:42px}h1{margin:0;font:500 24px Georgia,"Songti SC",serif}.month{display:flex;gap:12px;align-items:center;margin:34px 0 16px;color:var(--muted);font-size:13px}.month:after{content:"";height:1px;flex:1;background:var(--line)}article{padding:20px 0 28px;border-bottom:1px solid var(--line)}time{display:block;margin-bottom:12px;color:var(--accent);font-size:13px}h2{margin:0 0 8px;font:500 19px/1.45 Georgia,"Songti SC",serif}p{margin:0;white-space:pre-line}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);width:min(100%,420px);margin-top:15px}.photos[data-count="1"]{grid-template-columns:1fr}.photos[data-count="2"],.photos[data-count="3"],.photos[data-count="4"]{grid-template-columns:repeat(2,1fr);width:min(100%,330px)}.photo{position:relative;aspect-ratio:1;overflow:hidden;border:0;padding:0;background:#d5d1c9;cursor:zoom-in}.photos[data-count="1"] .photo{aspect-ratio:4/3}.photo img{width:100%;height:100%;object-fit:cover}.more:after{content:attr(data-more);position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:#0008;font-size:26px}.expand,.actions{border:0;padding:0;color:var(--muted);background:transparent;font:12px system-ui;cursor:pointer}.expand{margin-top:8px;color:var(--accent)}.actions{margin-top:11px}dialog{width:min(100vw,900px);max-width:none;height:100dvh;max-height:none;margin:0 auto;border:0;padding:0;color:#fff;background:#000f}dialog::backdrop{background:#000a}.viewer{display:grid;grid-template-rows:auto 1fr auto;height:100%}.viewer-top,.viewer-bottom{display:flex;justify-content:space-between;padding:18px 22px;color:#d4d4d2;font-size:13px}.viewer button{border:0;padding:8px;color:inherit;background:transparent;cursor:pointer}.viewer-stage{display:grid;grid-template-columns:54px 1fr 54px;align-items:center}.viewer-stage img{max-width:100%;max-height:calc(100dvh - 128px);justify-self:center;object-fit:contain}.viewer-nav{font-size:28px}@media(max-width:520px){main{padding:34px 18px 60px}.photos{width:100%}}</style>
<main><header><h1>Serein</h1><span>图文流原型</span></header><section id="feed"></section></main><dialog id="viewer"><div class="viewer"><div class="viewer-top"><span id="position"></span><button id="close">关闭 ×</button></div><div class="viewer-stage"><button class="viewer-nav" id="previous">‹</button><img id="large" alt=""><button class="viewer-nav" id="next">›</button></div><div class="viewer-bottom"><span id="caption"></span><span>← → 切换 · Esc 关闭</span></div></div></dialog>
<script>
const entries=[['2026年08月12日 18:40','傍晚的散步','下班后沿着河边走了一会儿。风把热气吹散，水面开始有一点点亮。',12],['2026年08月11日 09:20','','今天的第一杯咖啡。',9],['2026年07月30日 22:15','雨后的房间','窗户开着，空气是湿的。把白天没有做完的事情先放一放。\n\n这是一段用于确认长文字折叠行为的样本文本。它应该保持阅读上的安静，不抢走图片的注意力；需要时再展开全部内容。',4]];const colors=['879f95','7c95a8','b08f85','8da08a','8682a1','b1a174','9b7c6d','698d91','a48c99','8d9b70','8c7c71','748a9b'];const image=i=>`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#${colors[i%12]}"/><circle cx="${90+i*22%250}" cy="150" r="100" fill="#fff4"/></svg>`)}`;const feed=document.querySelector('#feed'),viewer=document.querySelector('#viewer'),large=document.querySelector('#large');let active=[],index=0,last='';function show(){large.src=active[index];position.textContent=`${index+1} / ${active.length}`;caption.textContent=`图片 ${index+1}`;previous.disabled=index===0;next.disabled=index===active.length-1}function open(count,start){active=Array.from({length:count},(_,i)=>image(i));index=start;show();viewer.showModal()}for(const[date,title,body,count]of entries){const month=date.slice(0,8);if(month!==last){feed.insertAdjacentHTML('beforeend',`<div class="month">${month}</div>`);last=month}const article=document.createElement('article');article.innerHTML=`<time>${date}</time>${title?`<h2>${title}</h2>`:''}`.slice(0,-1);const text=document.createElement('p');text.textContent=body;article.append(text);if(body.length>70){text.hidden=true;const toggle=document.createElement('button');toggle.className='expand';toggle.textContent='展开全文';toggle.onclick=()=>{text.hidden=!text.hidden;toggle.textContent=text.hidden?'展开全文':'收起'};article.append(toggle)}const grid=document.createElement('div');grid.className='photos';grid.dataset.count=Math.min(count,9);for(let i=0;i<Math.min(count,9);i++){const tile=document.createElement('button');tile.className='photo'+(i===8&&count>9?' more':'');tile.dataset.more=i===8?`+${count-9}`:'';tile.innerHTML=`<img src="${image(i)}" alt="第 ${i+1} 张图片">`;tile.onclick=()=>open(count,i);grid.append(tile)}article.append(grid);article.insertAdjacentHTML('beforeend','<div class="actions">编辑　·　历史版本　·　删除</div>');feed.append(article)}previous.onclick=()=>{if(index){index--;show()}};next.onclick=()=>{if(index<active.length-1){index++;show()}};close.onclick=()=>viewer.close();document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft')previous.click();if(e.key==='ArrowRight')next.click()});
</script>
