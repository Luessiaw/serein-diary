services:
  api:
    build:
      context: ./backend
      network: host
      args:
        HTTP_PROXY: ${DIARY_BUILD_HTTP_PROXY:-http://127.0.0.1:17897}
        HTTPS_PROXY: ${DIARY_BUILD_HTTPS_PROXY:-http://127.0.0.1:17897}
        NO_PROXY: ${DIARY_BUILD_NO_PROXY:-localhost,127.0.0.1}
    user: "${DIARY_API_UID:-1000}:${DIARY_API_GID:-1000}"
    environment:
      DIARY_DATA_DIR: /data
      DIARY_TIMEZONE: ${DIARY_TIMEZONE:-Asia/Shanghai}
      DIARY_ADMIN_PASSWORD: ${DIARY_ADMIN_PASSWORD:-change-this-before-first-start}
      DIARY_SESSION_SECRET: ${DIARY_SESSION_SECRET:-replace-with-a-real-random-secret-at-least-32-chars}
      DIARY_IMMICH_ENABLED: ${DIARY_IMMICH_ENABLED:-false}
      DIARY_IMMICH_BASE_URL: ${DIARY_IMMICH_BASE_URL:-http://immich-api:2283/api}
      DIARY_IMMICH_API_KEY_FILE: /run/secrets/immich-api-key
    volumes:
      - ${DIARY_HOST_DATA_DIR:-./data}:/data
      - type: bind
        source: ${DIARY_IMMICH_API_KEY_HOST_FILE:-/dev/null}
        target: /run/secrets/immich-api-key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - serein-immich
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
    restart: unless-stopped

networks:
  serein-immich:
    external: true
    name: serein-immich
