[project]
name = "serein-backend"
version = "0.1.0"
description = "FastAPI backend for Serein."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "itsdangerous>=2.2,<3.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
